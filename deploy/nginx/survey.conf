# nginx: публикация survey наружу. /etc/nginx/sites-available/survey.conf → sites-enabled.
# Предполагается: Tomcat 11 на 127.0.0.1:8080 с контекстом /survey; wildcard-сертификат *.bigcom.ru.

limit_req_zone $binary_remote_addr zone=survey_pub:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name survey.bigcom.ru;

    ssl_certificate     /etc/ssl/bigcom/fullchain.pem;
    ssl_certificate_key /etc/ssl/bigcom/privkey.pem;

    client_max_body_size 4m;

    # Корень → приложение
    location = / { return 302 /survey/; }

    # Интеграция с 1С — только из внутренней сети (адреса серверов ERP уточнить)
    location ^~ /survey/api/v1/sync/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;
        include /etc/nginx/snippets/survey-proxy.conf;
    }

    # Публичные пути анкеты — ограничение частоты по IP
    location ^~ /survey/api/v1/public/ {
        limit_req zone=survey_pub burst=30 nodelay;
        include /etc/nginx/snippets/survey-proxy.conf;
    }

    # actuator наружу не отдаём
    location ^~ /survey/actuator/ { deny all; }

    location ^~ /survey/ {
        include /etc/nginx/snippets/survey-proxy.conf;
    }
}

server {
    listen 80;
    server_name survey.bigcom.ru;
    return 301 https://$host$request_uri;
}
