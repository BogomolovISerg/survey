# survey: фрагменты для ВНУТРЕННЕГО nginx, где приложения публикуются локейшенами
# внутри одного server{} в /etc/nginx/sites-enabled/default (как /devrestore/, /tokenization/).
#
# 1) map — рядом с map $http_upgrade В НАЧАЛЕ ФАЙЛА (вне server{}).
#    Схема для X-Forwarded-Proto: если запрос пришёл от внешнего nginx с его заголовком (https) —
#    сохраняем; при прямом обращении по внутренней сети (ERP, curl) — фактическая ($scheme).
#    Если оставить $scheme, как у соседей, Spring будет считать соединение http:
#    не поставится Secure-cookie входа персонала и QR-ссылки соберутся с http://.
map $http_x_forwarded_proto $survey_proto {
    default $scheme;
    "https" "https";
    "http"  "http";
}

# 2) локейшены — внутрь server{}, рядом с остальными приложениями.

location = /survey { return 301 /survey/; }

# Интеграция с 1С — только внутренняя сеть (подсети уточнить; внешний nginx сюда не проксирует и сам отдаёт 404)
location ^~ /survey/api/v1/sync/ {
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $survey_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
}

# actuator (health) — только с самого сервера
location ^~ /survey/actuator/ {
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
}

# всё остальное приложение: анкета, панель стенда, админка, публичный API
location ^~ /survey/ {
    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $survey_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
}
