# ТОЛЬКО для схемы «IIS на границе → внутренний nginx (10.0.0.4) → Tomcat». Если перед IIS стоит свой nginx
# (интернет → nginx → IIS → Tomcat), этот файл не нужен: лимиты — на краевом nginx, см. survey-edge-ratelimit.conf.
#
# survey: фрагменты для ВНУТРЕННЕГО nginx, где приложения публикуются локейшенами
# внутри одного server{} в /etc/nginx/sites-enabled/default (как /devrestore/, /tokenization/).
#
# 1) map — рядом с map $http_upgrade В НАЧАЛЕ ФАЙЛА (вне server{}).
#    Схема для X-Forwarded-Proto: если запрос пришёл от внешнего nginx с его заголовком (https) —
#    сохраняем; при прямом обращении по внутренней сети (ERP, curl) — фактическая ($scheme).
#    Если оставить $scheme, как у соседей, Spring будет считать соединение http:
#    не поставится Secure-cookie входа персонала и QR-ссылки соберутся с http://.
map $http_x_forwarded_proto $survey_proto {
    default $scheme;
    "https" "https";
    "http"  "http";
}

# 1а) Лимиты частоты по адресу ПОСЕТИТЕЛЯ (вне server{}, рядом с map выше).
#    Через IIS (ARR) все запросы приходят на этот nginx с одного адреса erp-web, поэтому $remote_addr для лимитов
#    непригоден: все посетители считались бы одним клиентом. Реальный адрес — последний элемент X-Forwarded-For:
#    его выставляет IIS (см. deploy/iis/web.config), всё, что мог подставить клиент, стоит левее.
#    ERP_WEB_IP — внутренний адрес erp-web (если узлов IIS несколько — по строке на каждый). Это блок geo: пока
#    ERP_WEB_IP не заменён на настоящий адрес, `nginx -t` падает, то есть забытую подстановку не пропустить.
#    Если IIS заголовок не передал, ключ пустой и запрос в лимите не учитывается (отказ в пользу доступности).
map $http_x_forwarded_for $survey_xff_last {
    default "";
    "~(?<last>[^,\s]+)\s*$" $last;
}
geo $survey_via_iis {
    default          0;
    ERP_WEB_IP/32    1;
}
map $survey_via_iis $survey_client_ip {
    default  $remote_addr;      # прямое обращение по внутренней сети (не через IIS)
    1        $survey_xff_last;  # через IIS
}
limit_req_zone $survey_client_ip zone=survey_pub:10m  rate=10r/s;   # публичный API анкеты
# Заказ звонка стоит денег: отдельный, более строгий предел. Посетители за одним адресом (общий Wi-Fi площадки,
# мобильный NAT) делят его: подберите rate/burst под ожидаемое число людей на площадке одновременно.
limit_req_zone $survey_client_ip zone=survey_call:10m rate=30r/m;

# 2) локейшены — внутрь server{}, рядом с остальными приложениями.

location = /survey { return 301 /survey/; }

# Интеграция с 1С — только внутренняя сеть (подсети уточнить; внешний nginx сюда не проксирует и сам отдаёт 404)
location ^~ /survey/api/v1/sync/ {
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $survey_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
}

# actuator (health) — только с самого сервера
location ^~ /survey/actuator/ {
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
}

# публичный API анкеты: ограничение частоты по IP посетителя
location ^~ /survey/api/v1/public/ {
    limit_req zone=survey_pub burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $survey_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    # Заказ flash-call: действуют оба предела (заголовки проксирования наследуются от внешнего location)
    location ~ ^/survey/api/v1/public/events/[^/]+/phone/call$ {
        limit_req zone=survey_pub burst=30 nodelay;
        limit_req zone=survey_call burst=20 nodelay;
        proxy_pass http://tomcat;
    }
}

# всё остальное приложение: анкета, панель стенда, админка
location ^~ /survey/ {
    proxy_pass http://tomcat;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $survey_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
}
