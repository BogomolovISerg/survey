# ВАРИАНТ «отдельный server{}». Если внутренний nginx публикует приложения локейшенами
# в одном server{} (sites-enabled/default) — используйте survey-locations.conf вместо этого файла.
# ВНУТРЕННИЙ nginx (сервер с Tomcat 11, контекст /survey на 127.0.0.1:8080).
# Принимает трафик от внешнего nginx (доверяем его X-Forwarded-*) и от ERP по внутренней сети.
#
# Заменить: EXTERNAL_NGINX_IP — адрес внешнего nginx (откуда приходят запросы); подсети ERP в allow.
# Файл → /etc/nginx/sites-available/survey-internal.conf → sites-enabled; snippet → /etc/nginx/snippets/

# Схема: если запрос пришёл через внешний nginx с X-Forwarded-Proto — сохраняем его (https),
# иначе (прямой вызов из ERP по внутренней сети) — фактическая схема соединения.
map $http_x_forwarded_proto $survey_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

server {
    listen 80;
    # внешний домен (так приходит Host от внешнего nginx) + внутреннее имя/адрес для ERP
    server_name survey.bigcom.ru survey.internal.local _;

    # Реальный адрес клиента — из X-Forwarded-For, но только если запрос пришёл от доверенного внешнего nginx
    set_real_ip_from EXTERNAL_NGINX_IP;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 4m;

    location = / { return 302 /survey/; }

    # Интеграция с ERP — только внутренние подсети (внешний nginx сюда и так не проксирует)
    location ^~ /survey/api/v1/sync/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/survey-proxy-headers.conf;
    }

    location ^~ /survey/actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/survey-proxy-headers.conf;
    }

    location ^~ /survey/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/survey-proxy-headers.conf;
    }
}
