# ВНЕШНИЙ nginx (узел с публичным доменом survey.bigcom.ru). Терминирует TLS и проксирует
# на внутренний сервер приложений (nginx → Tomcat). Здесь же отсекаем всё, что снаружи не нужно.
#
# Заменить: APP_INTERNAL_IP — внутренний адрес сервера с Tomcat/nginx; пути к сертификату.
# Файл → /etc/nginx/sites-available/survey-external.conf → sites-enabled; nginx -t; systemctl reload nginx

limit_req_zone $binary_remote_addr zone=survey_pub:10m rate=10r/s;

# Снаружи заголовкам клиента не доверяем: схема — фактическая (https)
map $scheme $survey_proto { default $scheme; }

upstream survey_app {
    server APP_INTERNAL_IP:80;      # внутренний nginx (или APP_INTERNAL_IP:8080 — напрямую Tomcat, тогда внутренний nginx не нужен)
    keepalive 16;
}

server {
    listen 80;
    server_name survey.bigcom.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name survey.bigcom.ru;

    ssl_certificate     /etc/ssl/bigcom/fullchain.pem;   # wildcard *.bigcom.ru
    ssl_certificate_key /etc/ssl/bigcom/privkey.pem;

    client_max_body_size 4m;

    location = / { return 302 /survey/; }

    # Снаружи интеграция с 1С и actuator недоступны вообще
    location ^~ /survey/api/v1/sync/  { return 404; }
    location ^~ /survey/actuator/     { return 404; }

    # Публичные пути анкеты — ограничение частоты по IP посетителя
    location ^~ /survey/api/v1/public/ {
        limit_req zone=survey_pub burst=30 nodelay;
        proxy_pass http://survey_app;
        include /etc/nginx/snippets/survey-proxy-headers.conf;
    }

    location ^~ /survey/ {
        proxy_pass http://survey_app;
        include /etc/nginx/snippets/survey-proxy-headers.conf;
    }
}
