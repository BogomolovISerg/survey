# /etc/nginx/snippets/survey-proxy-headers.conf — одинаков на ВНЕШНЕМ и ВНУТРЕННЕМ nginx.
# Host и X-Forwarded-* должны дойти до Tomcat без искажений: по ним Spring строит Secure-cookie и абсолютные ссылки.
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $survey_proto;   # переменная задаётся map'ом в survey-external.conf / survey-internal.conf
proxy_set_header   X-Forwarded-Host  $host;
proxy_read_timeout 60s;
proxy_redirect     off;
