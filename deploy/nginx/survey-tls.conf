# ВАРИАНТ без IIS/ARR: TLS терминируется прямо на 10.0.0.4.
# Шлюз пробрасывает внешний TCP-порт (443 отдельного IP или, если внешний IP один и 443 занят IIS, — 8443)
# на 10.0.0.4:443. Наружу открыт ТОЛЬКО этот server{} — публикует /survey/ и ничего больше
# (остальные приложения из sites-enabled/default остаются доступными только на :80 из внутренней сети).
#
# Файл → /etc/nginx/sites-available/survey-tls.conf → sites-enabled; сертификат wildcard *.bigcom.ru
# скопировать на сервер (fullchain + key), пути поправить. nginx -t && systemctl reload nginx.
#
# Если внешний порт 8443: public-base-url в /opt/tomcat11/conf/apps/survey/application.yml
# должен быть https://survey.bigcom.ru:8443/survey — тогда QR и ссылки соберутся с портом.

limit_req_zone $binary_remote_addr zone=survey_pub2:10m rate=10r/s;
# Заказ звонка стоит денег: отдельный, более строгий предел по IP. Много посетителей за одним адресом (общий Wi-Fi
# площадки, мобильный NAT) делят этот предел: подберите rate/burst под ожидаемое число людей на площадке.
limit_req_zone $binary_remote_addr zone=survey_call2:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name survey.bigcom.ru;

    ssl_certificate     /etc/ssl/bigcom/fullchain.pem;
    ssl_certificate_key /etc/ssl/bigcom/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    location = / { return 302 /survey/; }

    # Снаружи интеграции и actuator нет (1С ходит на :80 по внутренней сети)
    location ^~ /survey/api/v1/sync/ { return 404; }
    location ^~ /survey/actuator/    { return 404; }

    location ^~ /survey/api/v1/public/ {
        limit_req zone=survey_pub2 burst=30 nodelay;
        proxy_pass http://tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;

        # Заказ flash-call: действуют оба предела (общий для публичных путей и строгий для звонка)
        location ~ ^/survey/api/v1/public/events/[^/]+/phone/call$ {
            limit_req zone=survey_pub2 burst=30 nodelay;
            limit_req zone=survey_call2 burst=20 nodelay;
            proxy_pass http://tomcat;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout 60s;
        }
    }

    location ^~ /survey/ {
        proxy_pass http://tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # всё прочее на этом порту не публикуем
    location / { return 404; }
}
